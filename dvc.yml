
stages:

  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
    outs:
      - data/raw

  preprocessing:
    cmd: python src/preprocessing.py
    deps:
      - src/preprocessing.py
      - data/raw
    params:
      - preprocessing.min_rating
      - preprocessing.max_users
      - preprocessing.max_movies
    outs:
      - data/preprocessed

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/preprocessed
    params:
      - feature_engineering.model_name
    outs:
      - data/processed
      - artifacts/user2id.json
      - artifacts/item2id.json
      - artifacts/id2item.json

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed
      - artifacts/user2id.json
      - artifacts/id2item.json
    params:
      - train.epochs
      - train.learning_rate
      - train.hidden_channels
      - train.k
    outs:
      - artifacts/model.pt
      - artifacts/item_faiss.index
      - artifacts/user_embeddings.json
      - artifacts/training_plot.png
    metrics:
      - artifacts/metrics.json:
          cache: false
